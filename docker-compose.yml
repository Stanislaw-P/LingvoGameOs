name: lingvogameos

x-game-environment: &game-environment
  LINGVO_API_URL: http://api:8080/api
  PORTAL_URL: "${PORTAL_PUBLIC_URL:-${SITE_PUBLIC_HOST:?fill SITE_PUBLIC_HOST in the env file}}"
  SECRET_KEY: "${GAMES_FLASK_SECRET:-${GAMES_API_SECRET:?fill GAMES_API_SECRET in the env file}}"
  APP_SECRET_KEY: "${GAMES_FLASK_SECRET:-${GAMES_API_SECRET}}"

x-game-service: &game-service
  init: true
  restart: unless-stopped
  depends_on:
    api:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?fill POSTGRES_USER in the env file}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?fill POSTGRES_PASSWORD in the env file}"
      POSTGRES_DB: "${POSTGRES_DB:?fill POSTGRES_DB in the env file}"
    volumes:
      - "${POSTGRES_DATA_PATH:-./postgres-db}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  web:
    image: "lingvogameos/web:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: LingvoGameOsWeb
        CSPROJ: LingvoGameOsWeb/LingvoGameOs.csproj
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:?fill ASPNETCORE_ENVIRONMENT in the env file}"
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_HOST: postgres
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD_YANDEX: "${POSTGRES_PASSWORD}"
      POSTGRES_PASSWORD_TimeWeb: "${POSTGRES_PASSWORD}"
      ADMIN_USER_PASSWORD: "${ADMIN_USER_PASSWORD:?fill ADMIN_USER_PASSWORD in the env file}"
      DEVELOPER_USER_PASSWORD: "${DEVELOPER_USER_PASSWORD:?fill DEVELOPER_USER_PASSWORD in the env file}"
      GAMES_API_SECRET: "${GAMES_API_SECRET:?fill GAMES_API_SECRET in the env file}"
      GAMES_FOLDER_PATH: /home/app/games
      GAMES_MANAGED_EXTERNALLY: "true"
      PRODUCTION_URL: "${SITE_PUBLIC_HOST:?fill SITE_PUBLIC_HOST in the env file}"
      DEVELOPMENT_URL: "${SITE_PUBLIC_HOST}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD:-}"
      VKID_CLIENT_ID: "${VKID_CLIENT_ID:-}"
      VKID_CLIENT_SECRET: "${VKID_CLIENT_SECRET:-}"
      AWS_YANDEX_KEY_ID: "${AWS_YANDEX_KEY_ID:-}"
      AWS_YANDEX_KEY: "${AWS_YANDEX_KEY:-}"
      AWS_YANDEX_BUCKET_NAME: "${AWS_YANDEX_BUCKET_NAME:-}"
      AWS_YANDEX_SERVICE_URL: "${AWS_YANDEX_SERVICE_URL:-}"
      AWS_TIMEWEB_KEY_ID: "${AWS_TIMEWEB_KEY_ID:-}"
      AWS_TIMEWEB_KEY: "${AWS_TIMEWEB_KEY:-}"
      AWS_TIMEWEB_BUCKET_NAME: "${AWS_TIMEWEB_BUCKET_NAME:-}"
      AWS_TIMEWEB_SERVICE_URL: "${AWS_TIMEWEB_SERVICE_URL:-}"
    ports:
      - "${SITE_IP:-127.0.0.1}:${SITE_PORT:-8080}:8080"
    volumes:
      - logs:/app/Logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  api:
    image: "lingvogameos/api:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: LingvoGameOsWebApi
        CSPROJ: LingvoGameOsWebApi/LingvoGameOsWebApi.csproj
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:?fill ASPNETCORE_ENVIRONMENT in the env file}"
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_HOST: postgres
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD_YANDEX: "${POSTGRES_PASSWORD}"
      POSTGRES_PASSWORD_TimeWeb: "${POSTGRES_PASSWORD}"
      GAMES_API_SECRET: "${GAMES_API_SECRET}"
    ports:
      - "${SITE_IP:-127.0.0.1}:${API_PORT:-8081}:8080"
    volumes:
      - logs:/app/Logs
    depends_on:
      postgres:
        condition: service_healthy
      # Оба приложения вызывают Database.Migrate(). API ждёт Web, чтобы они
      # не применяли миграции одновременно на новой базе.
      web:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  game-piece:
    <<: *game-service
    image: "lingvogameos/game-piece:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile.game
      target: final
      additional_contexts:
        game: "${GAMES_SOURCE_PATH:-./games}/lingvo-piece-by-piece"
    environment:
      <<: *game-environment
      GAME_PORT: "8080"
      GAME_PATH_BASE: "/games/piece-by-piece"
      GAME_COOKIE_NAME: "lingvogameos_piece_session"
    expose:
      - "8080"
    volumes:
      - game-piece-db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  game-crossword:
    <<: *game-service
    image: "lingvogameos/game-crossword:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile.game
      target: final
      additional_contexts:
        game: "${GAMES_SOURCE_PATH:-./games}/crossword-ossetia"
    environment:
      <<: *game-environment
      GAME_PORT: "8080"
      GAME_PATH_BASE: "/games/crossword"
      GAME_COOKIE_NAME: "lingvogameos_crossword_session"
    expose:
      - "8080"
    volumes:
      - game-crossword-db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  game-puzzles:
    <<: *game-service
    image: "lingvogameos/game-puzzles:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile.game
      target: final
      additional_contexts:
        game: "${GAMES_SOURCE_PATH:-./games}/linvgo-puzzles_in_ossetian"
    environment:
      <<: *game-environment
      GAME_PORT: "8080"
      GAME_PATH_BASE: "/games/puzzles"
      GAME_COOKIE_NAME: "lingvogameos_puzzles_session"
    expose:
      - "8080"
    volumes:
      - game-puzzles-db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  game-who-faster:
    <<: *game-service
    image: "lingvogameos/game-who-faster:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile.game
      target: final
      additional_contexts:
        game: "${GAMES_SOURCE_PATH:-./games}/Who_faster/who_faster"
    environment:
      <<: *game-environment
      GAME_PORT: "8080"
      GAME_MODULE: app
      GAME_DATABASE_PATH: /app/db/game.db
      GAME_PATH_BASE: "/games/who-faster"
      GAME_COOKIE_NAME: "lingvogameos_who_faster_session"
    command:
      - sh
      - -c
      - >-
        test -f /app/db/game.db || cp /app/game.db /app/db/game.db;
        exec python -c "import os, importlib; m = importlib.import_module(os.environ.get('GAME_MODULE','server')); m.app.run(host='0.0.0.0', port=int(os.environ.get('GAME_PORT','8080')))"
    expose:
      - "8080"
    volumes:
      - game-who-faster-db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  game-iron-detective:
    <<: *game-service
    image: "lingvogameos/game-iron-detective:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile.game-dotnet
      additional_contexts:
        game: "${GAMES_SOURCE_PATH:-./games}/iron-detective"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ASPNETCORE_URLS: http://+:8080
      LINGVO_API_URL: http://api:8080
      GAME_PATH_BASE: "/games/iron-detective"
      GAME_COOKIE_NAME: "lingvogameos_iron_detective_session"
    expose:
      - "8080"

  game-rebusi:
    <<: *game-service
    image: "lingvogameos/game-rebusi:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile.game
      target: final
      additional_contexts:
        game: "${GAMES_SOURCE_PATH:-./games}/osetinckie-rebusi"
    environment:
      <<: *game-environment
      GAME_PORT: "8080"
      GAME_PATH_BASE: "/games/rebusi"
      GAME_COOKIE_NAME: "lingvogameos_rebusi_session"
    expose:
      - "8080"
    volumes:
      - game-rebusi-db:/app/db
      - game-rebusi-content:/app/static/images/rebus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  game-mazaika:
    <<: *game-service
    image: "lingvogameos/game-mazaika:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile.game
      target: final
      additional_contexts:
        game: "${GAMES_SOURCE_PATH:-./games}/ossetian-mazaika"
    environment:
      <<: *game-environment
      GAME_PORT: "8080"
      GAME_PATH_BASE: "/games/mazaika"
      GAME_COOKIE_NAME: "lingvogameos_mazaika_session"
    expose:
      - "8080"
    volumes:
      - game-mazaika-db:/app/db
      - game-mazaika-content:/app/static/custom_levels
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  logs:
  game-piece-db:
  game-crossword-db:
  game-puzzles-db:
  game-who-faster-db:
  game-rebusi-db:
  game-rebusi-content:
  game-mazaika-db:
  game-mazaika-content:
